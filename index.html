<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Главная</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f5f5;
      gap: 16px;
    }
    h1 { margin-bottom: 24px; }
    a.button {
      display: inline-block;
      padding: 12px 28px;
      background: #24292e;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      font-size: 16px;
      transition: background 0.2s;
    }
    a.button:hover { background: #444; }
  </style>
</head>
<body>
  <h1>Главная страница</h1>
  <a class="button" href="/docs1/">Перейти в Docs1</a>
  <a class="button" href="/docs2/">Перейти в Docs2</a>

</html>
