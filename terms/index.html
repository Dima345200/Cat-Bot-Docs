<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Текст по центру сверху</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;   /* центрирование по горизонтали */
            justify-content: flex-start; /* прижатие к верху */
            padding-top: 60px;     /* отступ сверху */
            font-family: Arial, sans-serif;
            text-align: center;
            box-sizing: border-box;
        }

        h1 {
            margin: 0 0 20px;
        }

        p {
            max-width: 600px;
            font-size: 18px;
            color: #333;
            margin: 0;
        }
    </style>
</head>
<body>
    <h1>Заголовок</h1>
    <p>Это простой текст, который расположен по центру по горизонтали и сверху по вертикали.</p>
</body>
</html>
